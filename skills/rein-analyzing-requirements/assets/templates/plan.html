<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-->
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the same frame as the brief (index rail + one column). The cover
   answers the scheduler's questions in order: how much work, can we start,
   who has nothing yet, how far along, what changed. Then: the order to build
   in (batches by dependency), who does what (editable), each task in detail,
   tables/data/config, risks, changes. */
:root {
  --ground: #f3f4f6;
  --page: #ffffff;
  --sunk: #f6f7f9;
  --ink: #111926;
  --ink-2: #434e5f;
  --ink-3: #788294;
  --rule: #e2e5ea;
  --rule-2: #eef0f3;
  --accent: #2747a8;
  --accent-soft: #edf1fc;
  --k-ask: #845200;  --k-ask-bg: #fcefc6;
  --add: #12773b; --add-bg: #e0f2e6;
  --mod: #ad4706; --mod-bg: #fdeadb;
  --del: #b42318; --del-bg: #fbe5e2;
  --p0: #bf2519;  --p0-bg: #fde7e4;
  --test: #2747a8; --test-bg: #e6ecfb;
  --av-0: #2747a8; --av-1: #12773b; --av-2: #7b37ad; --av-3: #845200; --av-4: #0b6e74;
  --code-bg: #f6f7f9;
  --flash: rgba(39, 71, 168, .14);
  --lift: 0 1px 2px rgba(17, 25, 38, .04), 0 4px 18px rgba(17, 25, 38, .05);
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0c1016; --page: #11161d; --sunk: #161c24;
    --ink: #e4e8ee; --ink-2: #a9b2be; --ink-3: #7b8594;
    --rule: #252d37; --rule-2: #1b222b;
    --accent: #9fb3ff; --accent-soft: #1c2546;
    --k-ask: #f0c15a; --k-ask-bg: #372a0e;
    --add: #72d29b; --add-bg: #132e1e;
    --mod: #f5a669; --mod-bg: #382313;
    --del: #f28a80; --del-bg: #381a17;
    --p0: #ff8a7f;  --p0-bg: #381a17;
    --test: #9fb3ff; --test-bg: #1c2546;
    --av-0: #9fb3ff; --av-1: #72d29b; --av-2: #d8a5f5; --av-3: #f0c15a; --av-4: #6fd3d9;
    --code-bg: #0d1218;
    --flash: rgba(159, 179, 255, .16);
    --lift: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0c1016; --page: #11161d; --sunk: #161c24;
  --ink: #e4e8ee; --ink-2: #a9b2be; --ink-3: #7b8594;
  --rule: #252d37; --rule-2: #1b222b;
  --accent: #9fb3ff; --accent-soft: #1c2546;
  --k-ask: #f0c15a; --k-ask-bg: #372a0e;
  --add: #72d29b; --add-bg: #132e1e;
  --mod: #f5a669; --mod-bg: #382313;
  --del: #f28a80; --del-bg: #381a17;
  --p0: #ff8a7f;  --p0-bg: #381a17;
  --test: #9fb3ff; --test-bg: #1c2546;
  --av-0: #9fb3ff; --av-1: #72d29b; --av-2: #d8a5f5; --av-3: #f0c15a; --av-4: #6fd3d9;
  --code-bg: #0d1218;
  --flash: rgba(159, 179, 255, .16);
  --lift: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.8 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: .88em; background: var(--sunk); border: 1px solid var(--rule-2); border-radius: 5px; padding: 0 4px; }
.mono, .id { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }

/* ---------- frame ---------- */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--ground); border-right: 1px solid var(--rule); padding: 22px 18px 28px 26px; }
.main { min-width: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
@media (max-width: 1080px) { .app { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } }
@media (max-width: 720px) { .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* ---------- rail: the requirement's files, then this page's index ---------- */
.files { display: grid; gap: 1px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--rule); }
.files-h { font-size: 11.5px; color: var(--ink-3); letter-spacing: .08em; margin-bottom: 4px; }
.files > a, .files > span { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; padding: 4px 10px; margin-left: -10px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2); }
.files a:hover { background: var(--rule-2); text-decoration: none; }
.files .on { background: var(--page); color: var(--ink); font-weight: 600; box-shadow: var(--lift); }
.files .no { color: var(--ink-3); opacity: .7; }
.files i { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.rail-kind { font-size: 12px; color: var(--ink-3); letter-spacing: .1em; }
.rail-title { font-size: 16px; font-weight: 700; line-height: 1.4; margin-top: 2px; }
.rail-id { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; overflow-wrap: anywhere; }
.toc { margin-top: 18px; display: grid; gap: 1px; }
.toc a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; margin-left: -10px; border-radius: 8px; color: var(--ink-2); font-size: 14px; }
.toc a:hover { background: var(--rule-2); text-decoration: none; }
.toc a.on { background: var(--page); color: var(--ink); font-weight: 600; box-shadow: var(--lift); }
.toc .n { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.toc .n.hot { color: var(--mod); font-weight: 700; }

/* ---------- toolbar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--rule); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; }
.search { position: relative; flex: 1 1 200px; min-width: 0; display: flex; align-items: center; }
.search svg { position: absolute; left: 10px; width: 15px; height: 15px; color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; font-size: 14px; padding: 6px 34px 6px 32px; border: 1px solid var(--rule); border-radius: 9px; background: var(--sunk); color: var(--ink); }
.search input:focus { outline: none; border-color: var(--accent); background: var(--page); box-shadow: 0 0 0 3px var(--accent-soft); }
.search kbd { position: absolute; right: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 5px; padding: 0 5px; line-height: 18px; background: var(--page); }
.seg { display: inline-flex; padding: 3px; background: var(--rule-2); border-radius: 9px; }
.seg button { border: 0; background: none; padding: 3px 11px; border-radius: 7px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--page); color: var(--ink); font-weight: 600; box-shadow: var(--lift); }
.pick { font-size: 13px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 9px; background: var(--page); color: var(--ink); }
.chgnav { display: inline-flex; align-items: center; gap: 4px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; white-space: nowrap; margin-right: 4px; }
.switch input { appearance: none; -webkit-appearance: none; width: 32px; height: 19px; border-radius: 19px; background: var(--rule); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 13px; height: 13px; border-radius: 50%; background: var(--page); transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.switch input:checked { background: var(--mod); }
.switch input:checked::after { transform: translateX(13px); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 1px solid var(--rule); border-radius: 8px; background: var(--page); cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.icon-btn svg { width: 14px; height: 14px; }
.chgpos { font-size: 12.5px; color: var(--mod); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 3.6em; text-align: center; }
@media (max-width: 560px) { .search { flex-basis: 100%; } }

/* ---------- cover ---------- */
.cover { padding-block: 40px 8px; }
.cover-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px; align-items: start; }
@media (max-width: 860px) { .cover-top { grid-template-columns: minmax(0, 1fr); } }
.kicker { font-size: 12.5px; color: var(--ink-3); letter-spacing: .06em; }
.cover h1 { font-size: 34px; line-height: 1.22; margin: 8px 0 14px; letter-spacing: .01em; }
.lead { font-size: 18px; line-height: 1.75; max-width: 34em; }
.lead b { font-weight: 700; font-variant-numeric: tabular-nums; }
.tblock { margin: 6px 0 0; display: grid; grid-template-columns: auto auto; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; font-size: 13px; min-width: 230px; }
.tblock dt, .tblock dd { margin: 0; padding: 6px 12px; border-bottom: 1px solid var(--rule-2); }
.tblock dt { color: var(--ink-3); background: var(--sunk); white-space: nowrap; }
.tblock dd { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.tblock dt:nth-last-child(2), .tblock dd:last-child { border-bottom: 0; }
.tblock dd.send { font-family: var(--font); font-weight: 600; font-size: 13px; }
.status { margin-top: 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .status { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .status { grid-template-columns: minmax(0, 1fr); } }
.st { display: grid; align-content: start; gap: 1px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--rule); color: var(--ink); background: var(--page); min-width: 0; }
a.st:hover { text-decoration: none; border-color: var(--ink-3); }
.st-l { font-size: 12.5px; color: var(--ink-3); }
.st-v { font-size: 19px; font-weight: 700; line-height: 1.4; }
.st a.st-v { color: var(--ink); justify-self: start; }
.st.chg a.st-v { color: var(--mod); }
.st a.st-v:hover { text-decoration: underline; text-underline-offset: 4px; }
.seg.vs { justify-self: start; padding: 2px; border-radius: 8px; margin: -3px 0 1px -2px; }
.seg.vs button { padding: 2px 9px; font-size: 12px; border-radius: 6px; }
.kicker .latest { color: var(--ink-3); }
.st-s { font-size: 13px; color: var(--ink-2); line-height: 1.6; }
.st.go { background: var(--add-bg); border-color: transparent; } .st.go .st-v { color: var(--add); }
.st.wait { background: var(--k-ask-bg); border-color: transparent; } .st.wait .st-v { color: var(--k-ask); }
.st.chg .st-v { color: var(--mod); }
.st.who .st-v { color: var(--k-ask); }
.prog { display: flex; height: 8px; border-radius: 8px; overflow: hidden; background: var(--rule-2); margin: 8px 0 6px; }
.prog i { display: block; height: 100%; }
.prog .done { background: var(--add); }
.prog .testing { background: var(--test); }
.prog .doing { background: var(--mod); }
.lgs { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lgs > span { white-space: nowrap; }
.lg-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.lg-dot.todo { background: var(--rule); box-shadow: inset 0 0 0 1px var(--ink-3); }
.lg-dot.doing { background: var(--mod); } .lg-dot.testing { background: var(--test); } .lg-dot.done { background: var(--add); }
.hold { margin-top: 12px; border-radius: var(--r); background: var(--k-ask-bg); padding: 12px 14px; }
.hold h2 { font-size: 13px; font-weight: 700; color: var(--k-ask); letter-spacing: .06em; margin: 0 0 8px 2px; }
.hold ul { display: grid; gap: 6px; }
.hold li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; padding: 9px 12px; border-radius: 9px; background: var(--page); }
.hold li .hq { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); }

/* ---------- shared bits ---------- */
.mk { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; font-size: 11.5px; font-weight: 700; line-height: 1; flex: none; }
.mk-add { color: var(--add); background: var(--add-bg); }
.mk-modify { color: var(--mod); background: var(--mod-bg); }
.mk-remove { color: var(--del); background: var(--del-bg); }
.ktag { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 0 7px; border-radius: 6px; line-height: 20px; white-space: nowrap; color: var(--ink-2); background: var(--rule-2); }
.ktag.modify { color: var(--mod); background: var(--mod-bg); }
.ktag.internal { color: var(--ink-2); background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
.wait-chip { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; color: var(--k-ask); background: var(--k-ask-bg); padding: 0 7px; border-radius: 6px; line-height: 20px; white-space: nowrap; }
.wait-chip.soft { color: var(--ink-2); background: var(--rule-2); font-weight: 500; }
.sp { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.sp::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.sp.todo { color: var(--ink-3); font-weight: 500; } .sp.todo::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.sp.doing { color: var(--mod); } .sp.testing { color: var(--test); } .sp.done { color: var(--add); }
.av { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.av b { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 700; color: var(--page); background: var(--c, var(--ink-3)); flex: none; }
.av.none { color: var(--k-ask); }
.av.none b { background: transparent; color: var(--k-ask); box-shadow: inset 0 0 0 1.5px currentColor; border: 0; }
.fchip { display: inline-flex; align-items: baseline; gap: 5px; font-size: 12.5px; padding: 1px 9px; border-radius: 7px; background: var(--sunk); border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
a.fchip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.fchip .id { font-size: 11.5px; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.ln { position: relative; }
.ln.is-chg::before { content: ""; position: absolute; left: -12px; top: 5px; bottom: 5px; width: 3px; border-radius: 3px; background: var(--c, var(--mod)); }
.chg-add { --c: var(--add); } .chg-modify { --c: var(--mod); } .chg-remove { --c: var(--del); }
.was { display: block; margin-top: 1px; font-size: 13px; color: var(--ink-3); }
.was s { text-decoration-color: color-mix(in srgb, var(--del) 55%, transparent); }
.was b { font-weight: 500; margin-right: 6px; }
.gone-t { text-decoration: line-through; color: var(--ink-3); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 40% { background: var(--flash); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

/* ---------- sections ---------- */
section { padding-top: 56px; scroll-margin-top: 64px; }
.sec-h { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.sec-h h2 { font-size: 23px; line-height: 1.35; display: flex; align-items: baseline; gap: 10px; }
.sec-h h2 .n { font-size: 14px; font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sec-h p { margin-top: 4px; font-size: 14px; color: var(--ink-3); }
.part-h { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .08em; margin-bottom: 6px; }
.nochange { display: none; color: var(--ink-3); font-size: 14px; }
body.only-changes section[data-has-changes="0"] .sec-body { display: none; }
body.only-changes section[data-has-changes="0"] .nochange { display: block; }
body.only-changes [data-changed="0"] { display: none !important; }
.client-h { display: flex; align-items: center; gap: 12px; margin: 34px 0 14px; font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: .04em; }
.client-h:first-child { margin-top: 0; }
.client-h::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.client-h .n { font-weight: 400; color: var(--ink-3); }

/* ---------- order: batches by dependency ---------- */
.order-box { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sunk); }
.order { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(172px, 1fr); gap: 0 36px; padding: 16px 18px 20px; min-width: min-content; }
.batch { position: relative; z-index: 2; display: grid; align-content: start; gap: 10px; }
.batch-h { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .06em; display: flex; justify-content: space-between; align-items: baseline; }
.batch-h span { font-weight: 400; letter-spacing: 0; }
.onode { display: grid; gap: 4px; padding: 9px 12px 10px; border-radius: 10px; background: var(--page); border: 1px solid var(--rule); box-shadow: var(--lift); color: var(--ink); transition: opacity .15s, border-color .15s; }
.onode:hover { text-decoration: none; border-color: var(--ink-3); }
.onode .top { display: flex; align-items: baseline; gap: 6px; }
.onode .id { font-size: 12px; color: var(--accent); font-weight: 600; }
.onode .nm { font-weight: 600; font-size: 14px; line-height: 1.45; }
.onode .bot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; }
.onode .av { font-size: 12.5px; }
.onode .av b { width: 18px; height: 18px; font-size: 10.5px; }
.onode .dep-l { display: none; font-size: 12px; color: var(--ink-3); }
.onode.blocked { border-color: color-mix(in srgb, var(--k-ask) 55%, var(--rule)); background: color-mix(in srgb, var(--k-ask-bg) 45%, var(--page)); }
.onode.st-done .nm { color: var(--ink-3); }
.order.focus .onode:not(.hl) { opacity: .32; }
.order.focus .order-edges path:not(.hl) { opacity: .15; }
.order-edges { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; overflow: visible; color: var(--ink-3); }
.order-edges path { fill: none; stroke: currentColor; stroke-width: 1.4; transition: opacity .15s; }
.order-edges path.hl { stroke: var(--accent); stroke-width: 2; }
.order-edges marker path { fill: currentColor; stroke: none; }
.order-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); }
.order-legend span { display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 720px) {
  .order-box { background: transparent; border: 0; overflow: visible; }
  .order { grid-auto-flow: row; grid-auto-columns: auto; gap: 18px; padding: 0; min-width: 0; }
  .order-edges { display: none; }
  .onode .dep-l { display: block; }
}

/* ---------- assign table ---------- */
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--rule-2); vertical-align: middle; }
thead th { border-top: 0; font-size: 12px; color: var(--ink-3); font-weight: 600; background: var(--sunk); white-space: nowrap; }
tbody th { font-weight: 400; }
tr.grp th { background: var(--page); font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: .04em; padding-top: 14px; }
tr.grp th span { font-weight: 400; color: var(--ink-3); margin-left: 6px; }
td.task { min-width: 190px; }
td.task a { color: var(--ink); font-weight: 600; }
td.task .id { color: var(--accent); font-size: 12.5px; margin-right: 8px; font-weight: 600; }
td.task .ktag { margin-left: 6px; }
td.nowrap { white-space: nowrap; }
tr.gone td { color: var(--ink-3); }
tr.gone td.task a { color: var(--ink-3); text-decoration: line-through; }
tr.ln.is-chg td:first-child { box-shadow: inset 3px 0 0 var(--c); }
tr.ln.is-chg::before { display: none; }
.who-in { width: 7.5em; font-size: 13.5px; padding: 3px 8px; border: 1px solid transparent; border-radius: 7px; background: transparent; }
.who-in:hover { border-color: var(--rule); }
.who-in:focus { outline: none; border-color: var(--accent); background: var(--page); box-shadow: 0 0 0 3px var(--accent-soft); }
.who-in::placeholder { color: var(--k-ask); opacity: 1; }
.st-sel { font-size: 13px; font-weight: 600; padding: 3px 24px 3px 9px; border-radius: 7px; border: 1px solid transparent; cursor: pointer; appearance: none; -webkit-appearance: none; background: var(--rule-2); }
.st-wrap { position: relative; display: inline-block; }
.st-wrap::after { content: ""; position: absolute; right: 9px; top: 50%; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-70%) rotate(45deg); pointer-events: none; color: var(--ink-3); }
.st-sel.todo { color: var(--ink-2); background: var(--rule-2); }
.st-sel.doing { color: var(--mod); background: var(--mod-bg); }
.st-sel.testing { color: var(--test); background: var(--test-bg); }
.st-sel.done { color: var(--add); background: var(--add-bg); }
.st-sel:focus { outline: none; border-color: var(--accent); }
.edited { position: relative; }
.edited::after { content: ""; position: absolute; top: 6px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.sec-tools { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }

/* ---------- task cards ---------- */
.cards { display: grid; gap: 18px; }
.card { background: var(--page); border: 1px solid var(--rule); border-radius: 14px; padding: 20px 24px 20px 26px; scroll-margin-top: 72px; box-shadow: var(--lift); min-width: 0; }
@media (max-width: 560px) { .card { padding: 16px 16px 16px 20px; } }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.card-h .id { font-size: 13px; font-weight: 600; color: var(--accent); }
.card-h h3 { font-size: 19px; line-height: 1.4; }
.card-h .right { margin-left: auto; display: inline-flex; align-items: center; gap: 12px; }
.card .sum { margin-top: 6px; color: var(--ink); font-size: 15.5px; }
.card.gone { background: transparent; box-shadow: none; border-style: dashed; padding-block: 14px; }
.card.gone h3, .card.gone .card-h .id { text-decoration: line-through; color: var(--ink-3); }
.card.gone .sum { color: var(--ink-3); }
.card.is-chg, .card.chg-modify { border-color: color-mix(in srgb, var(--c) 45%, var(--rule)); }
.banner { margin-top: 14px; padding: 9px 14px; border-radius: 10px; background: var(--k-ask-bg); color: var(--k-ask); font-size: 13.5px; font-weight: 600; }
.banner.soft { background: var(--sunk); color: var(--ink-2); font-weight: 500; }
.banner a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.facts { margin: 14px 0 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; font-size: 14px; padding: 12px 14px; border-radius: 10px; background: var(--sunk); }
.facts dt { color: var(--ink-3); font-size: 13px; }
.facts dd { margin: 0; min-width: 0; }
.facts dd.mono { font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 520px) { .facts { grid-template-columns: minmax(0, 1fr); gap: 0; } .facts dd { margin-bottom: 8px; } }
.part { margin-top: 18px; }
.steps { counter-reset: s; display: grid; gap: 6px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.steps li::after { content: none; }
.steps .num { font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: right; }
.dots li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; color: var(--ink-2); padding: 1px 0 1px 18px;
  background: radial-gradient(circle, var(--ink-3) 2.4px, transparent 3px) no-repeat 0 .62em / 6px 6px; }
.dots.warn li { background-image: radial-gradient(circle, var(--k-ask) 2.6px, transparent 3.2px); }
.dots.risk li { background-image: radial-gradient(circle, var(--p0) 2.6px, transparent 3.2px); }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 680px) { .duo { grid-template-columns: minmax(0, 1fr); } }

/* ---------- tables, data, config ---------- */
.blocks { display: grid; gap: 12px; }
.blk { border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 18px; background: var(--page); min-width: 0; scroll-margin-top: 72px; }
.blk-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.blk-h .tname { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.blk-h b { font-weight: 600; }
.blk p { margin-top: 4px; color: var(--ink-2); font-size: 14px; }
.blk .note { margin-top: 6px; font-size: 13px; color: var(--mod); }
.blk.gone { background: transparent; border-style: dashed; }
.blk.gone .tname, .blk.gone .blk-h b { text-decoration: line-through; color: var(--ink-3); }
.blk.gone p { color: var(--ink-3); }
.blk details { margin-top: 8px; }
.blk summary { cursor: pointer; font-size: 13px; color: var(--accent); width: max-content; }
pre { margin: 8px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--code-bg); border: 1px solid var(--rule-2); overflow-x: auto; font: 12.5px/1.65 var(--mono); color: var(--ink); }
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.subh { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 26px 0 10px; letter-spacing: .04em; }
.subh:first-child { margin-top: 0; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: baseline; }

/* ---------- changes + basis ---------- */
.cg + .cg { margin-top: 22px; }
.cg h3 { font-size: 13px; font-weight: 700; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.ci { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--rule-2); }
.ci .refs { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
.ci .refs a, .ci .refs span { font-family: var(--mono); font-size: 12px; }
.earlier { margin-top: 18px; }
.earlier > summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
.basis { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 22px; font-size: 14px; margin: 0; }
.basis dt { color: var(--ink-3); }
.basis dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.caveat { margin-top: 20px; font-size: 13.5px; color: var(--ink-2); background: var(--sunk); border-radius: var(--r); padding: 12px 16px; }
.foot { height: 96px; }

/* ---------- edit bar ---------- */
.editbar { position: fixed; z-index: 15; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 16px; border-radius: 12px; background: var(--ink); color: var(--page); box-shadow: 0 12px 32px rgba(0, 0, 0, .22); font-size: 14px; }
.editbar button { border: 0; border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.editbar .go { background: var(--page); color: var(--ink); font-weight: 600; }
.editbar .clear { background: transparent; color: var(--page); opacity: .7; }
.copybox { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; }
.search-miss { display: none !important; }
.dim { opacity: .3; }

@media print {
  .rail, .bar, .editbar { display: none !important; }
  .app { display: block; }
  .card, .blk { box-shadow: none; break-inside: avoid; }
  section { padding-top: 28px; }
}
</style>
<!--/HEAD-->
</head>
<body>
<!--BODY-->
<noscript><p style="padding:24px">__NOSCRIPT__</p></noscript>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main" id="main"></div>
</div>
<div class="editbar" id="editbar" hidden></div>
<datalist id="owners"></datalist>
<script id="req-data" type="application/json">__REQ_DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("req-data").textContent);
  /* A working copy carries change marks for each comparison it offers (D.diffs: "send" = what readers
     see, "prev" = since the version before); ?vs= picks one, otherwise D.vs. Sent copies have only D.diff. */
  var VS = null;
  if (D.diffs) {
    var askedVs = (location.search.match(/[?&]vs=(send|prev)(?:&|$)/) || [])[1];
    VS = askedVs && D.diffs.hasOwnProperty(askedVs) ? askedVs : D.vs;
    D.diff = D.diffs[VS];
    if (D.view_clients) D.clients = D.view_clients[VS];
  }
  /* The change tile's label; a working copy offering two comparisons shows the switch instead,
     each button's tooltip naming the exact copy or version. */
  function vsLabel(label) {
    var keys = D.diffs ? Object.keys(D.diffs) : [];
    if (keys.length < 2) return '<span class="st-l">' + h(label) + "</span>";
    return '<span class="seg vs" role="group" aria-label="' + h(t("vs_label")) + '">' + keys.map(function (k) {
      var b = D.diffs[k] && D.diffs[k].base;
      var tip = !b ? t("vs_first") : b.kind === "send" ? t("base_send", { n: b.no, date: b.date }) : t("base_version", { v: b.v });
      return '<button type="button" data-vs="' + k + '" aria-pressed="' + (k === VS) + '" title="' + h(tip) + '">' +
        h(t(k === "send" ? "vs_send" : "vs_prev")) + "</button>";
    }).join("") + "</span>";
  }
  /* Switching reloads with ?vs=, keeping the rest of the link (a picked client, say). */
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-vs]");
    if (!b || b.dataset.vs === VS) return;
    var rest = location.search.replace(/^\?/, "").split("&").filter(function (p) { return p && p.indexOf("vs=") !== 0; });
    location.search = "?" + rest.concat("vs=" + b.dataset.vs).join("&");
  });
  var A = D.analysis, T = D.t, M = D.meta, X = D.diff || { items: {}, lists: {}, old: {} };
  var KEY = "req-plan:" + M.id;

  /* ---------- helpers ---------- */
  function t(k, v) {
    var s = T[k];
    if (s == null) return k;
    return v ? s.replace(/\{(\w+)\}/g, function (_, n) { return v[n] == null ? "" : v[n]; }) : s;
  }
  function h(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function rich(s) { return h(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function $(s, el) { return (el || document).querySelector(s); }
  function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(KEY + ":" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(KEY + ":" + k, JSON.stringify(v)); } catch (e) { /* storage off: edits live until reload */ } }
  };
  var base = X.base;
  var baseLabel = !base ? "" : base.kind === "send" ? t("base_send", { n: base.no, date: base.date }) : t("base_version", { v: base.v });
  var baseVars = { base: baseLabel };
  // Anchors on the brief: features are #f-<id>, questions #q-<id>.
  function briefLink(prefix, id) { return D.brief_file ? h(D.brief_file) + "#" + prefix + h(id) : ""; }
  function mark(s) { return base && s && s !== "same" ? '<span class="mk mk-' + s + '" title="' + h(t("mark_" + s + "_title", baseVars)) + '">' + h(t("mark_" + s)) + "</span>" : ""; }
  function chg(s) { return base && s && s !== "same" ? " ln is-chg chg-" + s : " ln"; }

  /* ---------- model ---------- */
  var BE = A.backend || {};
  var STATUSES = ["todo", "doing", "testing", "done"];
  var clients = arr(A.clients);
  var clientName = {};
  clients.forEach(function (c) { clientName[c.id] = c.name; });
  var apis = arr(BE.apis);
  var live = apis.filter(function (x) { return !x.removed; });
  var byId = {};
  apis.forEach(function (x) { byId[x.id] = x; });
  var features = arr(A.features), fById = {};
  features.forEach(function (f) { fById[f.id] = f; });
  var featuresOf = {};
  features.forEach(function (f) {
    if (f.removed) return;
    arr(f.apis).forEach(function (id) { (featuresOf[id] = featuresOf[id] || []).push(f); });
  });
  var questions = arr(A.questions), qById = {};
  questions.forEach(function (q) { qById[q.id] = q; });

  // An open P0 question blocks the APIs it names, and the APIs of the features it names.
  var hard = {}, soft = {};
  questions.forEach(function (q) {
    if (q.status !== "open") return;
    var ids = [];
    arr(q.affects).forEach(function (id) {
      if (byId[id]) ids.push(id);
      else if (fById[id]) arr(fById[id].apis).forEach(function (a) { ids.push(a); });
    });
    var into = q.priority === "P0" ? hard : soft;
    ids.forEach(function (id) {
      into[id] = into[id] || [];
      if (into[id].indexOf(q) < 0) into[id].push(q);
    });
  });

  // Owner and status as edited on this page, kept per browser until copied to the AI.
  var edits = store.get("edits", {});
  // Drop edits the analysis already has (written back and rendered again) or that point at nothing.
  Object.keys(edits).forEach(function (id) {
    var x = byId[id], e = edits[id] || {};
    if (!x || x.removed) { delete edits[id]; return; }
    if (e.owner != null && e.owner === (x.owner || "")) delete e.owner;
    if (e.status && e.status === (x.status || "todo")) delete e.status;
    if (e.owner == null && e.status == null) delete edits[id];
  });
  store.set("edits", edits);
  function ownerOf(x) { var e = edits[x.id]; return e && e.owner != null ? e.owner : (x.owner || ""); }
  function statusOf(x) { var e = edits[x.id]; return e && e.status ? e.status : (x.status || "todo"); }
  function setEdit(id, key, value) {
    var x = byId[id], orig = key === "owner" ? (x.owner || "") : (x.status || "todo");
    var e = edits[id] || {};
    if (value === orig) delete e[key]; else e[key] = value;
    if (e.owner == null && e.status == null) delete edits[id]; else edits[id] = e;
    store.set("edits", edits);
  }

  // Batches: a task goes one column after the latest task it depends on.
  var level = {};
  function depth(id, seen) {
    if (level[id] != null) return level[id];
    if (seen[id]) return 0;
    seen[id] = true;
    var d = 0;
    arr(byId[id] && byId[id].depends).forEach(function (p) { if (byId[p] && !byId[p].removed) d = Math.max(d, depth(p, seen) + 1); });
    return (level[id] = d);
  }
  live.forEach(function (x) { depth(x.id, {}); });
  var batches = [];
  live.forEach(function (x) { (batches[level[x.id]] = batches[level[x.id]] || []).push(x); });
  // Keep each task near what it waits for, so arrows cross less.
  batches.forEach(function (col, i) {
    if (!i) return;
    var prev = batches[i - 1].map(function (x) { return x.id; });
    function key(x) {
      var ps = arr(x.depends).map(function (p) { return prev.indexOf(p); }).filter(function (n) { return n >= 0; });
      return ps.length ? Math.min.apply(null, ps) : 99;
    }
    col.sort(function (a, b) { return key(a) - key(b) || (a.id < b.id ? -1 : 1); });
  });

  var kindKey = function (x) { return x.internal ? "internal" : x.kind; };
  var owners = [];
  apis.forEach(function (x) { if (x.owner && owners.indexOf(x.owner) < 0) owners.push(x.owner); });
  function avatar(name, cls) {
    if (!name) return '<span class="av none' + (cls || "") + '"><b>?</b>' + h(t("owner_none")) + "</span>";
    var i = owners.indexOf(name); if (i < 0) i = owners.length;
    return '<span class="av' + (cls || "") + '" style="--c: var(--av-' + (i % 5) + ')"><b>' + h(name.charAt(0)) + "</b>" + h(name) + "</span>";
  }
  function pill(s) { return '<span class="sp ' + s + '">' + h(t("st_" + s)) + "</span>"; }
  function featureChips(x) {
    return (featuresOf[x.id] || []).map(function (f) {
      var inner = '<span class="id">' + h(f.id) + "</span>" + h(f.name);
      return D.brief_file ? '<a class="fchip" href="' + briefLink("f-", f.id) + '">' + inner + "</a>" : '<span class="fchip">' + inner + "</span>";
    }).join("");
  }
  function apiItem(id) { return X.items["api:" + id]; }

  /* ---------- counts for the cover ---------- */
  var tables = arr(BE.tables).filter(function (x) { return !x.removed; });
  var data = arr(BE.data), configs = arr(BE.configs).filter(function (x) { return !x.removed; }), risks = arr(BE.risks);
  function count(list, f) { return list.filter(f).length; }
  var nModify = count(live, function (x) { return !x.internal && x.kind === "modify"; });
  var nNew = count(live, function (x) { return !x.internal && x.kind === "new"; });
  var nInternal = count(live, function (x) { return x.internal; });
  var blocked = live.filter(function (x) { return hard[x.id]; });
  function nobody() { return live.filter(function (x) { return !ownerOf(x); }); }

  /* ---------- rail ---------- */
  var SECTIONS = [
    ["cover", t("nav_cover")], ["order", t("nav_order")], ["assign", t("nav_assign")], ["tasks", t("nav_tasks")],
    ["data", t("nav_data")], ["risks", t("nav_risks")], ["changes", t("nav_changes")], ["basis", t("nav_basis")]
  ];
  function renderRail() {
    var files = arr(D.pages).map(function (p, i) {
      var inner = "<i>" + (i + 1) + "</i><span>" + h(p.label) + "</span>";
      if (p.current) return '<span class="on">' + inner + "</span>";
      if (!p.file) return '<span class="no" title="' + h(t("file_none")) + '">' + inner + "</span>";
      return '<a href="' + h(p.file) + '">' + inner + "</a>";
    }).join("");
    var counts = { tasks: live.length, risks: risks.length, changes: base ? X.total : null };
    $("#rail").innerHTML =
      '<div class="files"><div class="files-h">' + h(t("files_h")) + "</div>" + files + "</div>" +
      '<div class="rail-kind">' + h(t("kind")) + '</div><div class="rail-title">' + h(A.meta.title) + '</div><div class="rail-id mono">' + h(M.id) + "</div>" +
      '<nav class="toc" aria-label="' + h(t("toc")) + '">' + SECTIONS.filter(function (s) { return document.getElementById(s[0]); }).map(function (s) {
        var n = counts[s[0]];
        return '<a href="#' + s[0] + '" data-toc="' + s[0] + '"><span>' + h(s[1]) + "</span>" +
          (n != null ? '<span class="n' + (s[0] === "changes" && n ? " hot" : "") + '">' + n + "</span>" : "") + "</a>";
      }).join("") + "</nav>";
  }

  /* ---------- toolbar ---------- */
  var view = store.get("view", { side: "all", owner: "", group: "side" });
  function renderBar() {
    var sides = [["all", t("side_all")]].concat(clients.map(function (c) { return [c.id, c.name]; }));
    var ownerOpts = ['<option value="">' + h(t("owner_all")) + "</option>"].concat(owners.map(function (o) {
      return '<option value="' + h(o) + '">' + h(o) + "</option>";
    })).concat(['<option value="-">' + h(t("owner_none")) + "</option>"]).join("");
    var nav = base && X.total ? '<div class="chgnav"><label class="switch"><input type="checkbox" id="only-changes">' + h(t("only_changes")) + "</label>" +
      '<button class="icon-btn" id="chg-prev" type="button" aria-label="' + h(t("chg_prev")) + '"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10l4-4 4 4"/></svg></button>' +
      '<span class="chgpos" id="chg-pos">' + X.total + "</span>" +
      '<button class="icon-btn" id="chg-next" type="button" aria-label="' + h(t("chg_next")) + '"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg></button></div>' : "";
    return '<div class="bar"><div class="wrap bar-in">' +
      '<label class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14"/></svg>' +
      '<input id="q" type="search" placeholder="' + h(t("search_ph")) + '" aria-label="' + h(t("search_ph")) + '"><kbd>/</kbd></label>' +
      '<div class="seg" role="group" aria-label="' + h(t("side_label")) + '">' + sides.map(function (s) {
        return '<button type="button" data-side="' + h(s[0]) + '" aria-pressed="' + (view.side === s[0]) + '">' + h(s[1]) + "</button>";
      }).join("") + "</div>" +
      '<select class="pick" id="owner-pick" aria-label="' + h(t("owner_label")) + '">' + ownerOpts + "</select>" + nav + "</div></div>";
  }

  /* ---------- cover ---------- */
  function renderCover() {
    var parts = [];
    if (nModify) parts.push(t("lead_modify", { n: nModify }));
    if (nNew) parts.push(t("lead_new", { n: nNew }));

      var s = X.items["data:" + i];
      return '<div class="blk' + chg(s) + '" data-changed="' + (base && s ? 1 : 0) + '"><div class="blk-h"><span class="tname">' + h(d.table) + '</span><span class="ktag">' + h(t("d_" + d.kind)) + "</span>" + mark(s) + "</div><p>" + rich(d.does) + "</p>" +
        "<details><summary>" + h(t("show_sql")) + "</summary><pre><code>" + h(d.sql) + (d.rollback ? "\n\n-- " + h(t("rollback")) + "\n" + h(d.rollback) : "") + (d.check ? "\n\n-- " + h(t("check")) + "\n" + h(d.check) : "") + "</code></pre></details></div>";
    }).join("");
    var cf = arr(BE.configs).map(function (c) {
      var s = X.items["config:" + c.key];
      if (c.removed) return removedBlock(c.key, "", '<span class="ktag">' + h(t("c_" + c.kind)) + "</span>", s, c.removed);
      return '<div class="blk' + chg(s) + '" data-changed="' + (base && s ? 1 : 0) + '"><div class="blk-h"><span class="tname">' + h(c.key) + '</span><span class="ktag' + (c.kind === "modify" ? " modify" : "") + '">' + h(t("c_" + c.kind)) + "</span>" + mark(s) + "</div><p>" + rich(c.does) + "</p></div>";
    }).join("");
    var body = (tb ? '<h3 class="subh">' + h(t("sub_tables")) + '</h3><div class="blocks">' + tb + "</div>" : "") +
      (dt ? '<h3 class="subh">' + h(t("sub_data")) + '</h3><div class="blocks">' + dt + "</div>" : "") +
      (cf ? '<h3 class="subh">' + h(t("sub_config")) + '</h3><div class="blocks">' + cf + "</div>" : "");
    if (!body) return "";
    var changed = Object.keys(X.items).some(function (k) { return /^(table|data|config):/.test(k); });
    return section("data", t("data_h"), null, t("data_p"), body, changed);
  }

  /* ---------- risks ---------- */
  function renderRisks() {
    var entries = base && X.lists.risks ? X.lists.risks : risks.map(function (r) { return { s: "same", item: r }; });
    if (!entries.length) return "";
    var lis = entries.map(function (e) {
      var r = e.item || e.old, s = e.s;
      var refs = arr(r.apis).map(function (id) { return '<a class="fchip" href="#api-' + h(id) + '"><span class="id">' + h(id) + "</span>" + h(byId[id] ? byId[id].name : "") + "</a>"; }).join("");
      return '<li class="' + chg(s) + '" data-changed="' + (s === "same" ? 0 : 1) + '"><span' + (s === "remove" ? ' class="gone-t"' : "") + ">" + rich(r.text) + "</span>" +
        '<span class="chips">' + (refs || '<span class="muted">' + h(t("risk_general")) + "</span>") + mark(s) + "</span></li>";
    }).join("");
    var changed = entries.some(function (e) { return e.s !== "same"; });
    return section("risks", t("risks_h"), risks.length, t("risks_p"), '<ul class="dots risk">' + lis + "</ul>", changed);
  }

  /* ---------- changes ---------- */
  function renderChanges() {
    var all = arr(D.changes);
    var n = base ? (X.new_changes || 0) : all.length;
    var recent = all.slice(0, n), earlier = all.slice(n);
    function item(c) {
      return '<div class="ci"><span>' + rich(c.text) + '</span><span class="refs">' + arr(c.refs).map(function (r) {
        return byId[r] ? '<a href="#api-' + h(r) + '">' + h(r) + "</a>" : "<span>" + h(r) + "</span>";
      }).join("") + "</span></div>";
    }
    function grouped(list) {
      return ["add", "modify", "remove"].map(function (type) {
        var l = list.filter(function (c) { return c.type === type; });
        return l.length ? '<div class="cg"><h3>' + mark(type) + h(t("change_" + type)) + "</h3>" + l.map(item).join("") + "</div>" : "";
      }).join("");
    }
    var body = (recent.length ? grouped(recent) : '<p class="muted">' + h(t("changes_none")) + "</p>") +
      (earlier.length ? '<details class="earlier"><summary>' + h(t("changes_earlier", { n: earlier.length })) + "</summary>" + grouped(earlier) + "</details>" : "");
    return section("changes", t("changes_h"), base ? X.total : null, base ? t("changes_since", baseVars) : t("changes_all"), body, true);
  }

  /* ---------- basis ---------- */
  function renderBasis() {
    var rows = [
      [t("b_req"), A.meta.title + " · " + M.id],
      [t("b_analysis"), "v" + M.analysis_v + " · " + M.generated],
      [t("b_doc"), "v" + M.doc_v + (A.meta.doc_version ? " · " + A.meta.doc_version : "")],
      [t("b_code"), A.meta.code_commit]
    ].map(function (r) { return "<dt>" + h(r[0]) + "</dt><dd>" + h(r[1]) + "</dd>"; }).join("");
    return section("basis", t("basis_h"), null, null, '<dl class="basis">' + rows + '</dl><p class="caveat">' + h(t("caveat")) + "</p>", false) + '<div class="foot"></div>';
  }

  /* ---------- render ---------- */
  $("#main").innerHTML = renderBar() + renderCover() + renderOrder() + renderAssign() + renderTasks() + renderData() + renderRisks() + renderChanges() + renderBasis();
  renderRail();  // after the sections, so the contents list only names the ones shown
  $("#owners").innerHTML = owners.map(function (o) { return '<option value="' + h(o) + '"></option>'; }).join("");
  refreshCover();

  /* ---------- filters: side, owner, search, only changes ---------- */
  var ownerPick = $("#owner-pick");
  ownerPick.value = view.owner || "";
  function matches(x, q) {
    if (!q) return true;
    var text = [x.id, x.name, x.does, x.where, x.now, x.path].concat(arr(x.todo), arr(x.online)).join(" ").toLowerCase();
    return text.indexOf(q) >= 0;
  }
  function visible(x, q) {
    if (view.side !== "all" && x.side !== view.side) return false;
    if (view.owner === "-" && ownerOf(x)) return false;
    if (view.owner && view.owner !== "-" && ownerOf(x) !== view.owner) return false;
    return matches(x, q);
  }
  function applyFilters() {
    var q = ($("#q").value || "").trim().toLowerCase();
    $$("[data-row]").forEach(function (tr) { tr.hidden = !visible(byId[tr.dataset.row], q); });
    $$("[data-card]").forEach(function (c) { c.hidden = !visible(byId[c.dataset.card], q); });
    $$(".client-group").forEach(function (g) { g.hidden = view.side !== "all" && g.dataset.side !== view.side; });
    $$("[data-node]").forEach(function (n) { n.classList.toggle("dim", !visible(byId[n.dataset.node], q)); });
    $$("tr.grp").forEach(function (g) {
      var next = g.nextElementSibling, any = false;
      while (next && !next.classList.contains("grp")) { if (!next.hidden) any = true; next = next.nextElementSibling; }
      g.hidden = !any;
    });
  }
  $$("[data-side]", $(".bar")).forEach(function (b) {
    b.addEventListener("click", function () {
      view.side = b.dataset.side; store.set("view", view);
      $$("[data-side]", $(".bar")).forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      applyFilters();
    });
  });
  ownerPick.addEventListener("change", function () { view.owner = ownerPick.value; store.set("view", view); applyFilters(); });
  $("#q").addEventListener("input", applyFilters);
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
  });

  var only = $("#only-changes");
  /* Stops for the change arrows: each change once, where it is described. The "who does what" table only sums up the cards. */
  function changedEls() { return $$(".is-chg").filter(function (el) { return el.offsetParent !== null && !el.closest(".gone-t") && !el.closest("#assign-body"); }); }
  var pos = -1;
  function go(step) {
    var list = changedEls();
    if (!list.length) return;
    pos = (pos + step + list.length) % list.length;
    var el = list[pos];
    el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    $("#chg-pos").textContent = (pos + 1) + " / " + list.length;
  }
  if (only) {
    only.addEventListener("change", function () { document.body.classList.toggle("only-changes", only.checked); pos = -1; drawEdges(); });
    $("#chg-prev").addEventListener("click", function () { go(-1); });
    $("#chg-next").addEventListener("click", function () { go(1); });
  }
  var chgCard = $("#c-chg");
  if (chgCard && only) chgCard.addEventListener("click", function () { only.checked = true; only.dispatchEvent(new Event("change")); });

  /* ---------- group-by ---------- */
  $$("[data-group]").forEach(function (b) {
    b.addEventListener("click", function () {
      view.group = b.dataset.group; store.set("view", view);
      $$("[data-group]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      $("#assign-body").innerHTML = tbody();
      applyFilters();
    });
  });

  /* ---------- edits: owner + status ---------- */
  function syncTask(id) {
    var x = byId[id], st = statusOf(x);
    var whoBox = $('[data-card-who="' + id + '"]');
    if (whoBox) whoBox.innerHTML = avatar(ownerOf(x)) + pill(st);
    var node = $('[data-node="' + id + '"]');
    if (node) {
      node.className = node.className.replace(/\bst-\w+/, "st-" + st);
      var bot = $(".bot", node);
      if (bot) bot.innerHTML = avatar(ownerOf(x)) + (hard[id] ? '<span class="wait-chip">' + h(t("wait_q", { q: hard[id].map(function (q) { return q.id; }).join(t("sep_ids")) })) + "</span>" : pill(st));
    }
    refreshCover();
    refreshBar();
  }
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.classList && el.classList.contains("st-sel")) {
      setEdit(el.dataset.id, "status", el.value);
      el.className = "st-sel " + el.value;
      el.closest("td").classList.toggle("edited", !!(edits[el.dataset.id] && edits[el.dataset.id].status));
      syncTask(el.dataset.id);
    }
    if (el.classList && el.classList.contains("who-in")) {
      setEdit(el.dataset.id, "owner", el.value.trim());
      el.closest("td").classList.toggle("edited", !!(edits[el.dataset.id] && edits[el.dataset.id].owner != null));
      syncTask(el.dataset.id);
      if (view.group === "owner") { $("#assign-body").innerHTML = tbody(); applyFilters(); }
    }
  });
  var bar = $("#editbar");
  function editLines() {
    var lines = [];
    apis.forEach(function (x) {
      var e = edits[x.id];
      if (!e) return;
      if (e.owner != null) lines.push(t("copy_owner", { id: x.id, name: x.name, old: x.owner || t("owner_none"), now: e.owner || t("owner_none") }));
      if (e.status) lines.push(t("copy_status", { id: x.id, name: x.name, old: t("st_" + (x.status || "todo")), now: t("st_" + e.status) }));
    });
    return lines;
  }
  function refreshBar() {
    var n = editLines().length;
    bar.hidden = !n;
    if (n) bar.innerHTML = "<span>" + h(t("bar_n", { n: n })) + '</span><button class="clear" type="button" id="clear-edits">' + h(t("bar_clear")) + '</button><button class="go" type="button" id="copy-edits">' + h(t("bar_copy")) + "</button>";
  }
  bar.addEventListener("click", function (e) {
    if (e.target.id === "clear-edits") {
      edits = {}; store.set("edits", edits);
      $("#assign-body").innerHTML = tbody(); applyFilters();
      apis.forEach(function (x) { if (!x.removed) syncTask(x.id); });
      return;
    }
    if (e.target.id !== "copy-edits") return;
    var text = [t("copy_header", { title: A.meta.title, id: M.id })].concat(editLines(), ["", t("copy_footer")]).join("\n"), btn = e.target;
    function done() { btn.textContent = t("bar_copied"); setTimeout(function () { btn.textContent = t("bar_copy"); }, 2400); }
    function fallback() {
      var box = document.createElement("textarea");
      box.className = "copybox"; box.value = text; document.body.appendChild(box); box.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      if (ok) { box.remove(); done(); } else { box.className = ""; box.style.cssText = "position:fixed;left:16px;right:16px;bottom:80px;height:40vh;z-index:30"; btn.textContent = t("bar_copy_failed"); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  });
  refreshBar();

  /* ---------- order: arrows + hover ---------- */
  var grid = $("#order-grid");
  if (grid) {
    grid.addEventListener("mouseover", function (e) {
      var n = e.target.closest && e.target.closest("[data-node]");
      if (!n) return;
      var rel = related(n.dataset.node);
      grid.classList.add("focus");
      $$("[data-node]", grid).forEach(function (m) { m.classList.toggle("hl", !!rel[m.dataset.node]); });
      $$("path[data-from]", grid).forEach(function (p) { p.classList.toggle("hl", !!(rel[p.dataset.from] && rel[p.dataset.to])); });
    });
    grid.addEventListener("mouseleave", function () { grid.classList.remove("focus"); });
  }
  drawEdges();
  if (window.ResizeObserver && grid) new ResizeObserver(drawEdges).observe(grid);
  else window.addEventListener("resize", drawEdges);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawEdges);

  /* ---------- rail highlight ---------- */
  if (window.IntersectionObserver) {
    var tocLinks = $$("[data-toc]");
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        tocLinks.forEach(function (a) { a.classList.toggle("on", a.dataset.toc === en.target.id); });
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    SECTIONS.forEach(function (s) { var el = document.getElementById(s[0]); if (el) io.observe(el); });
  }
  applyFilters();
})();
</script>
<!--/BODY-->
</body>
</html>
